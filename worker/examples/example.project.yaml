# An example project file — copy it to `factories/<your-project>.yaml` and fill it in.
#
# **This file is not served.** A project file in `factories/` is served, and the served set is
# exactly the files there, so an example that lived there would be a repository the factory
# polls and merges into. See `factories/README.md` and #23.
#
# The schema is exactly these six values and nothing more. A field beyond them is refused
# rather than ignored, so factory policy cannot move into project configuration.
#
# The image is built from `worker/Dockerfile` in this repository:
#
#   docker build -t ghcr.io/nanisoft/agent-factory-worker:1 worker/
#
# and proved by `bash worker/smoke-test.sh`.

name: example
repo:
  # Absolute http or https. The worker container fetches this itself, with no credential that
  # can write to it (ADR-0006, ADR-0010) -- the host pushes, not the container.
  url: https://github.com/NaniSoft/example
worker:
  # The image each round's worker container starts from. One fresh container per round, and
  # nothing survives it. Derive a project-specific image when the project needs a toolchain
  # the base does not carry -- see worker/docs/deriving-a-project-image.md.
  image: ghcr.io/nanisoft/agent-factory-worker:1
llm:
  # A full provider/model reference, because the provider prefix is how the factory knows
  # which canonical environment variable to re-emit the key under. A reference naming a
  # provider the factory does not know is refused at load rather than sending the agent a key
  # nothing reads (#38).
  model: anthropic/claude-sonnet-4-5
keys:
  # Names of environment variables, never their values. This is what keeps the project file
  # committable and rotation an environment change rather than a code change.
  github: EXAMPLE_GITHUB_TOKEN
  llm: EXAMPLE_ANTHROPIC_API_KEY