# The agent factory, as one deployment.
#
#   docker compose up temporal
#
# starts the durable workflow's server. The factory itself runs on this machine
# (`dotnet run --project src/agent-factory`) — ADR-0016: rounds are this machine's
# own child processes, so the factory has no container of its own and no daemon
# behind it. The board is at http://127.0.0.1:5000.
#
# ---------------------------------------------------------------------------
# THE MACHINE-ONLY LIMIT, NAMED WHERE IT IS DECIDED (#30)
#
# Every mapping below is pinned to 127.0.0.1 on purpose: only this machine can
# open the board, the Temporal UI, and only this machine can decide what merges.
# There is no login, because there is no second machine to ask who you are.
# Reaching either from anywhere else is a deliberate flip of the mapping and a
# token check on the board's writes — never an accident.
#
# ---------------------------------------------------------------------------
# DURABLE EXECUTION
#
# The per-ticket workflow lives in Temporal when `Factory:Temporal:Endpoint` is
# configured: a round in flight survives a restart of the factory, and the
# board's clicks reach the workflow as updates. The server is the dev
# single-binary (SQLite on a volume) and its UI is loopback like the board.
# Removing the endpoint returns the factory to store-only mode, which runs
# without a Temporal server at all.

services:
  # Durable workflow state. One dev server, SQLite on a volume, loopback only —
  # the same posture the factory itself has. The image's own entrypoint is the
  # auto-setup deployment script (Cassandra-shaped), so the entrypoint is
  # overridden to the server binary's start-dev, which is the documented
  # single-binary dev server. If this container is down the board still serves;
  # the factory's worker reconnects when it returns.
  temporal:
    image: temporalio/server:1.28.0
    container_name: agent-factory-temporal
    entrypoint: ["/bin/sh"]
    command: ["-c", "exec /usr/local/bin/temporal server start-dev --ip 0.0.0.0 --port 7233 --ui-port 8233 --db-filename /tmp/temporal.db"]
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal-data:/data

volumes:
  temporal-data:
